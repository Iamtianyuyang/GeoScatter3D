name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # Submodules (Catch2) are required; a checkout without submodules
      # cannot even generate the build system.
      - uses: actions/checkout@v4
        with:
          # Test the PR head itself rather than GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          # Guardrails compare a PR to merge-base(base, HEAD), not just HEAD^.
          fetch-depth: 0

      - name: Fetch guardrail base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin $env:GITHUB_BASE_REF

      # glfw3 + Vulkan headers/loader + glslangValidator via vcpkg.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-glfw3-vulkan-glslang-nlohmann-v3

      - name: Install dependencies
        run: >
          vcpkg install glfw3:x64-windows vulkan-headers:x64-windows
          vulkan-loader:x64-windows glslang[tools]:x64-windows
          nlohmann-json:x64-windows

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DGS3D_GLSLANG_VALIDATOR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/glslang/glslangValidator.exe"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # GPU-independent tests only: the pure-logic suites (GpuInfo, Data,
      # Runtime, TileStreaming) and the include-dependency lint all run
      # without a display or physical GPU.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Build Flutter Windows application
        env:
          VCPKG_ROOT: C:\vcpkg
        run: ./scripts/build_flutter_windows.ps1

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the historical budget comparison on the PR's actual history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Fetch guardrail base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # The ubuntu-24.04 runner's mirrorlist serves the base 'noble'
          # suite with 'main' only, so universe-only packages are invisible
          # to apt. Add universe straight from archive.ubuntu.com to bypass
          # the mirror; nlohmann-json3-dev lives in universe.
          sudo add-apt-repository -y "deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble universe"
          sudo apt-get update
          sudo apt-get install --yes ninja-build libglfw3-dev libvulkan-dev glslang-tools libssl-dev nlohmann-json3-dev

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: ui_flutter
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: ui_flutter
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test Flutter and native pipeline ABI
        working-directory: ui_flutter
        env:
          GS3D_PIPELINE_LIBRARY: ${{ github.workspace }}/build/src/libgs3d_pipeline_ffi.so
        run: flutter test --no-pub

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build glslang-tools
          sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'
      - name: Build native libraries
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          for abi in arm64-v8a x86_64; do
            cmake -S . -B "tmp/android-$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
              -DNLOHMANN_JSON_INCLUDE_DIR="$GITHUB_WORKSPACE/third_party/nlohmann/include"
            cmake --build "tmp/android-$abi" --target gs3d_ffi gs3d_pipeline_ffi --parallel 2
            jni="ui_flutter/android/app/src/main/jniLibs/$abi"
            mkdir -p "$jni"
            cp "tmp/android-$abi/src/ffi/libgs3d_ffi.so" "$jni/"
            cp "tmp/android-$abi/src/libgs3d_pipeline_ffi.so" "$jni/"
            triple=aarch64-linux-android
            if [ "$abi" = x86_64 ]; then triple=x86_64-linux-android; fi
            cp "$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$triple/libc++_shared.so" "$jni/"
          done
      - name: Build and inspect Android APK
        working-directory: ui_flutter
        run: |
          flutter pub get
          flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
          apk=build/app/outputs/flutter-apk/app-debug.apk
          for abi in arm64-v8a x86_64; do
            for library in libflutter.so libc++_shared.so libgs3d_ffi.so libgs3d_pipeline_ffi.so; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/$library"
            done
          done
