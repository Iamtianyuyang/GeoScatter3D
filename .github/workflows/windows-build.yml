name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # Submodules (Catch2) are required; a checkout without submodules
      # cannot even generate the build system.
      - uses: actions/checkout@v4
        with:
          # Test the PR head itself rather than GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          # Guardrails compare a PR to merge-base(base, HEAD), not just HEAD^.
          fetch-depth: 0

      - name: Fetch guardrail base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin $env:GITHUB_BASE_REF

      # glfw3 + Vulkan headers/loader + glslangValidator via vcpkg.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-glfw3-vulkan-glslang-nlohmann-v3

      - name: Install dependencies
        run: >
          vcpkg install glfw3:x64-windows vulkan-headers:x64-windows
          vulkan-loader:x64-windows glslang[tools]:x64-windows
          nlohmann-json:x64-windows

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DGS3D_GLSLANG_VALIDATOR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/glslang/glslangValidator.exe"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # GPU-independent tests only: the pure-logic suites (GpuInfo, Data,
      # Runtime, TileStreaming) and the include-dependency lint all run
      # without a display or physical GPU.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the historical budget comparison on the PR's actual history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Fetch guardrail base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # The ubuntu-24.04 runner's mirrorlist serves the base 'noble'
          # suite with 'main' only, so universe-only packages are invisible
          # to apt. Add universe straight from archive.ubuntu.com to bypass
          # the mirror; nlohmann-json3-dev lives in universe.
          sudo add-apt-repository -y "deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble universe"
          sudo apt-get update
          sudo apt-get install --yes ninja-build libglfw3-dev libvulkan-dev glslang-tools nlohmann-json3-dev

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: ui_flutter
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: ui_flutter
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test Flutter and native pipeline ABI
        working-directory: ui_flutter
        env:
          GS3D_PIPELINE_LIBRARY: ${{ github.workspace }}/build/src/libgs3d_pipeline_ffi.so
        run: flutter test --no-pub
