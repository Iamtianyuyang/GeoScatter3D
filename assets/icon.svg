<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GeoScatter3D pick icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111d"/>
      <stop offset="55%" stop-color="#091a2c"/>
      <stop offset="100%" stop-color="#0c2338"/>
    </linearGradient>

    <radialGradient id="pointBright" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#deefff"/>
      <stop offset="60%" stop-color="#9fd1ef"/>
      <stop offset="100%" stop-color="#5a98c8"/>
    </radialGradient>

    <linearGradient id="pickFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6dc"/>
      <stop offset="100%" stop-color="#efd28a"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app icon base -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="15.5" y="15.5" width="481" height="481" rx="106.5" fill="none" stroke="#9ed8f3" stroke-opacity="0.10" stroke-width="2"/>

  <!-- point cloud -->
  <g opacity="0.98">
    <!-- far / dim points -->
    <g fill="#3f6fa1" opacity="0.40">
      <circle cx="96" cy="312" r="12"/><circle cx="115" cy="380" r="9"/><circle cx="130" cy="252" r="8"/>
      <circle cx="142" cy="172" r="10"/><circle cx="182" cy="115" r="8"/><circle cx="194" cy="350" r="10"/>
      <circle cx="236" cy="84" r="8"/><circle cx="252" cy="155" r="10"/><circle cx="272" cy="224" r="10"/>
      <circle cx="302" cy="101" r="8"/><circle cx="318" cy="284" r="12"/><circle cx="326" cy="353" r="8"/>
      <circle cx="350" cy="132" r="9"/><circle cx="368" cy="205" r="8"/><circle cx="384" cy="340" r="11"/>
      <circle cx="215" cy="407" r="9"/><circle cx="274" cy="407" r="7"/><circle cx="162" cy="410" r="7"/>
    </g>

    <!-- near / brighter points -->
    <g fill="url(#pointBright)">
      <circle cx="120" cy="278" r="20"/><circle cx="148" cy="188" r="19"/>
      <circle cx="188" cy="242" r="15"/><circle cx="200" cy="136" r="17"/>
      <circle cx="250" cy="176" r="18"/><circle cx="258" cy="286" r="17"/>
      <circle cx="188" cy="355" r="18"/><circle cx="264" cy="382" r="16"/>
      <circle cx="334" cy="148" r="14"/><circle cx="332" cy="236" r="13"/>
    </g>

    <!-- medium points -->
    <g fill="#6f9fd0" opacity="0.78">
      <circle cx="106" cy="206" r="14"/><circle cx="132" cy="332" r="14"/>
      <circle cx="170" cy="292" r="12"/><circle cx="216" cy="196" r="13"/>
      <circle cx="218" cy="322" r="13"/><circle cx="290" cy="130" r="12"/>
      <circle cx="296" cy="206" r="13"/><circle cx="302" cy="328" r="12"/>
      <circle cx="360" cy="170" r="10"/><circle cx="360" cy="300" r="10"/>
    </g>
  </g>

  <!-- selected picked point -->
  <g transform="translate(248 256)">
    <!-- outer halo -->
    <circle cx="0" cy="0" r="33" fill="#f8edd0" opacity="0.18"/>

    <!-- selected point (Modified: Removed the central dot) -->
    <circle cx="0" cy="0" r="26" fill="url(#pickFill)"/>
    <circle cx="0" cy="0" r="10" fill="#fffaf0"/>
    <!-- 此处去掉了 r="4" 的深色小点 -->

    <!-- pick ring: warm amber, clearly distinct from blue points -->
    <g fill="none" stroke="#e7c36e" stroke-width="7" stroke-linecap="round">
      <path d="M0 -62 A62 62 0 0 1 38 -50"/>
      <path d="M50 -38 A62 62 0 0 1 62 0"/>
      <path d="M62 0 A62 62 0 0 1 50 38"/>
      <path d="M38 50 A62 62 0 0 1 0 62"/>
      <path d="M0 62 A62 62 0 0 1 -38 50"/>
      <path d="M-50 38 A62 62 0 0 1 -62 0"/>
      <path d="M-62 0 A62 62 0 0 1 -50 -38"/>
      <path d="M-38 -50 A62 62 0 0 1 0 -62"/>
    </g>

    <!-- pick ticks -->
    <g stroke="#f1d998" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-82" x2="0" y2="-68"/>
      <line x1="82" y1="0" x2="68" y2="0"/>
      <line x1="0" y1="82" x2="0" y2="68"/>
      <line x1="-82" y1="0" x2="-68" y2="0"/>
    </g>
  </g>
</svg>