# config/viewer.toml

[input]
mode = "bundle"
bundle_dir = "data/field_and_ele_source_rec_50m.gs3d.bundle"

[csv_convert]
# Shared preprocessing thread count for CSV/DAT conversion and tile build.
num_threads = 16
chunk_bytes = 16777216
min_parallel_file_bytes = 67108864
x_field = "X"
y_field = "Y"
z_field = "elevation"
primary_value_field = "field_statics"

[shader]
vertex_shader_path = "assets/shaders/point.vert.spv"
fragment_shader_path = "assets/shaders/point.frag.spv"

[window]
width = 1280
height = 720
title = "GeoScatter3D 三维散点查看器"
resizable = true
# ImGui docking 布局持久化文件路径；留空字符串 ("") 表示不持久化，每次启动
# 都用默认布局。之前是硬编码 io.IniFilename = nullptr，面板布局不会保存。
ui_layout_ini_path = "config/imgui_layout.ini"
# User comfort multiplier on top of the PPI-derived ui_scale.
#   final_ui_scale = clamp(ppi_scale * ui_scale_multiplier, 1.0, 2.5)
# Default 1.15 gives a modest comfort bump. Increase if UI feels too small,
# decrease if it feels too large.
ui_scale_multiplier = 1.15
# UI 主题：carbon-blue（碳蓝 · Modern SaaS，默认）| deep-graphite（石墨暗色）
# | instrument-amber（仪器琥珀）。运行期可在 视图→主题 菜单切换（不回写此文件）。
theme = "carbon-blue"
# Enable Dear ImGui Multi-Viewports: docked panels can be dragged into native
# OS windows. On unsupported platforms, such as Wayland, ImGui may disable it.
multi_viewports = true

[vulkan]
validation_layers = true

[graphics]
# 图形设备选择："auto"（自动，优先独立显卡、显存大者优先）
# 或 "uuid:<32位十六进制>"（固定某块显卡，UUID 跨重启/驱动更新稳定）。
# 这是可提交的项目默认值。欢迎页中的个人选择会写入 XDG/AppData
# 下的 geoscatter3d/preferences.toml，绝不会修改本文件。
preferred_gpu = "auto"

[render]
clear_color = [0.118, 0.133, 0.165, 1.0]
initial_point_size = 1.5

[camera]
mode = "fit"
position = [0.0, -14000.0, 6000.0]
target = [0.0, 0.0, 0.0]
up = [0.0, 0.0, 1.0]
fov_y = 45.0
near = 1.0
far = 100000.0

[controller]
rotate_speed = 1.0
pan_speed = 1.0
zoom_speed = 1.0

invert_rotate_x = false
invert_rotate_y = false
invert_pan_x = false
invert_pan_y = false

[lod]
enabled = true
keep_full_buffer = false

# sidecar_path = "data/field_and_ele_source_rec_50m.gs3dlod"
auto_load_sidecar = true
auto_save_sidecar = true
# Potree 式自动分层（替代旧的 target_point_counts / target_point_ratios）。
#   finest_target_points: 最精细层目标点数，反推锚定 voxel_size_0。
#   growth_factor: voxel_size 倍增系数。XY 数据 √2≈1.414 每层点数约减半。
#   min_points_per_level: 最粗层点数下限，低于此值停止分层。
# 对 33M XY 数据默认分 ~5 层（~2M → ~125K 点）。
finest_target_points = 2000000
growth_factor = 1.414
min_points_per_level = 100000
voxel_mode = "XY"
voxel_scale = 1.0

medium_delay_seconds = 0.20
high_delay_seconds = 0.80
use_lowest_while_interacting = true
# Frame-time-adaptive interacting level (on top of use_lowest_while_interacting,
# takes priority when true): climbs toward higher detail during interaction
# when frame time has headroom, backs off immediately when it doesn't,
# instead of always pinning to the lowest LOD tier while interacting.
adaptive_interacting_level = true
frame_time_budget_ms = 14.0
# 交互(缩放/平移/旋转)期间前台显示策略:
#   keep_stable    —— (默认) 交互时继续用当前相机渲染交互前已稳定显示的
#                      高质量数据(最高细节 LOD + 已驻留全分辨率 tile),绝不
#                      在交互途中切到稀疏粗 LOD。相机实时跟随,数据暂不降质。
#   coarse         —— 旧行为:交互时降到最低/自适应 LOD 并关闭 tile 叠加,
#                      换取最低端硬件交互帧率(会出现稀疏/层状粗 LOD)。
#   freeze_texture —— 极端兜底(当前按 keep_stable 处理)。
# 注:keep_stable 下上面的 use_lowest_while_interacting / adaptive_interacting_level
# 仍可保留(它们驱动的 LOD 选择继续在后台运行),只是其结果不会让前台显示降质。
interactive_display_mode = "keep_stable"
verbose = true

[viewport]
# Startup view count. Additional independent views can be opened from the UI.
count = 1

[tile]
enabled = true
# index_path = "data/field_and_ele_source_rec_50m.gs3dtiles.index"
# data_path = "data/field_and_ele_source_rec_50m.gs3dtiles"

# tile 投影宽度 >= 该像素值时加载全精度数据（对应 Potree 屏幕空间阈值）
min_tile_pixel_size = 50
# 已废弃的兼容字段：任何值都不会截断可见 tile。硬上限会造成块状细节伪影，
# 因此默认写为 0；后续应以连续的自适应 LOD，而不是截断，解决极端视图的预算问题。
max_visible_tiles = 0

use_full_z_range = true
verbose = true
# GPU LRU 软驻留预算。当前可见 tile 会被 pin，极端视图可暂时超过此值；默认
# 288 覆盖高峰可见集及相邻视野缓冲。基准报告会输出实际
# selected/required/resident tile 数，比较 reload 时必须同时比较这些工作负载。
gpu_cache_max_tiles = 288
# Upload at most 32 MiB of newly visible tile data per frame. The previous
# 8 MiB cap dominated cold-load latency on large visible working sets.
gpu_upload_budget_bytes = 33554432
# CPU tile cache memory budget. Cached tiles are evicted by LRU.
# Raised from 512MB -> 4GB so most/all tiles stay CPU-resident at larger
# scale, cutting repeat disk reads (helps the reload-latency goal).
cpu_cache_max_bytes = 4294967296

# 全量预加载:启动后一次性把所有瓦片读入并常驻 GPU(仅当总字节数 <=
# preload_max_bytes,装得进显存时),之后缩放/平移/旋转零加载延迟——不再
# 按需流式、不再受逐帧上传节流限制。瓦片选择(画哪些可见子集)改为每帧运行
# (纯 CPU,无 I/O),交互期间也实时跟随相机。超过预算时自动回退到按需流式。
preload_all = false
preload_max_bytes = 1610612736          # 1.5 GiB
preload_upload_budget_bytes = 67108864  # 64 MiB/帧(预加载阶段,几帧传完)
